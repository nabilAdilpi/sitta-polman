<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/assets/polman.png">
    <style>
        body {
            margin-top: 20vh;
        }
    </style>
</head>

<body>
    <div class="form">
        <label class="judul">
            <img src="/assets/polman.png" alt="logo polman">
            <h1 style="color: gray;">SITTA&ensp;</h1>
            <h1>POLMAN</h1>
        </label>
        <br><br><br>
        <label for="email" class="field" style="margin-bottom: 10px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
            <input type="email" id="email" name="email">
        </label>
        <br>
        <label for="password" class="field">
            <svg viewBox="0 0 16 16" aria-hidden="true">
                <path
                    d="M10.5 1a4.5 4.5 0 0 0-4.3 5.8L1 12v3h3v-1.5h1.5V12H7l1.7-1.7A4.5 4.5 0 1 0 10.5 1zm1.2 2.2a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6z" />
            </svg>
            <input type="password" id="password" name="password">
        </label>
        <button type="button" id="forgotPw">Lupa password?</button>
        <br>
        <button onclick="masuk()" type="button" style="font-weight: bold;">Masuk</button>
        <p id="pesan"></p>
        <button id="buatAkun" type="button">Belum punya akun?</button>
        <div id="modalReg" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="close">&times;</span>
                    <h2>INFORMASI</h2>
                </div>
                <div class="modal-body">
                    <p>Silahkan hubungi pihak kampus untuk membuat akun baru</p>
                </div>
            </div>
        </div>
        <div id="modalPw" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <span class="close-1">&times;</span>
                    <h2>INFORMASI</h2>
                </div>
                <div class="modal-body">
                    <p>Silahkan hubungi pihak kampus untuk mengganti password</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/script.js"></script>
    <script src="/js/data.js"></script>
</body>

</html>
